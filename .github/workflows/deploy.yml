name: Auto Deploy to VPS
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/funland-crm || cd /root/funland-crm || cd /home/funland-crm
            git pull origin main
            cd frontend
            npm install
            npm run build
            pm2 restart all || pm2 restart frontend || echo "PM2 restart skipped"